<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meri To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>Meri To-Do List</h1>
    <p class="subtitle" id="count">Koi kaam nahi hai</p>

    <!-- Naya kaam likhne ki jagah -->
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Naya kaam likho...">
      <button id="addBtn">Add</button>
    </div>

    <!-- Saare kaam yahan dikhenge -->
    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
